[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openrecon"
version = "0.1.0"
description = "Open-source attack surface intelligence platform. Give it a domain, get back a security intelligence map."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "openrecon contributors" }]
keywords = ["attack-surface", "asm", "osint", "recon", "security", "threat-intelligence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "httpx>=0.27",
  "dnspython>=2.6",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "cryptography>=42.0",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]
pdf = [
    "reportlab>=5.0.1",
]
# Pip-installable OSS scanners. SpiderFoot is deliberately absent: it is not
# published to PyPI as a usable release (only a 0.0.1 placeholder exists), so it
# is installed from GitHub - see `openrecon collectors` for the hint.
tools = [
    "sqlmap>=1.8",
]
all = ["openrecon[ai,api,dev,pdf,tools]"]

[project.scripts]
openrecon = "openrecon.cli:main"

[project.urls]
Homepage = "https://github.com/kohryan/openrecon"
Issues = "https://github.com/kohryan/openrecon/issues"

[tool.hatch.build.targets.wheel]
packages = ["openrecon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
